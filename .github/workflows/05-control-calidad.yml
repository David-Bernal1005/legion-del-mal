name : Control de Calidad de la Legión

on:
    push:
        branches: [main]
    pull_request:
        branches: [main] 
jobs:
    Control-de-calidad:
        runs-on: ubuntu-latest

        steps:
            - name: Brainiac accede a los planes
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: El consejo revisa los cambios
              run: |
                chmod +x scripts/validar-planes.sh
                ./scripts/validar-planes.sh
                echo "Revisando los cambios"
                echo "====================="
                echo ""
                echo "Archivos modificados"
                if [ "${{ github.event_name }}" = "pull_request" ]; then
                  BASE_SHA="${{ github.event.pull_request.base.sha }}"
                else
                  BASE_SHA="${{ github.event.before }}"
                fi

                if git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
                  ARCHIVOS_MODIFICADOS=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
                else
                  ARCHIVOS_MODIFICADOS=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")
                fi

                printf '%s\n' "$ARCHIVOS_MODIFICADOS"
                echo ""
                echo "Archivos modificados en planes"
                printf '%s\n' "$ARCHIVOS_MODIFICADOS" | grep 'planes/' || true