name : Control de Calidad de la Legión

on:
    push:
        branches: [main]
    pull_request:
        branches: [main] 
jobs:
    Control-de-calidad:
        runs-on: ubuntu-latest

        steps:
            - name: Brainiac accede a los planes
              uses: actions/checkout@v4

            - name: El consejo revisa los cambios
              run: |
                chmod +x scripts/validar-planes.sh
                ./scripts/validar-planes.sh
                echo "Revisando los cambios"
                echo "====================="
                echo ""
                echo "Archivos modificados"
                git diff --name-only ${{ github.event.before}} ${{ github.sha}}
                echo ""
                echo "Archivos modificados en planes"
                git diff --name-only ${{ github.event.before}} ${{ github.sha}} | grep planes/