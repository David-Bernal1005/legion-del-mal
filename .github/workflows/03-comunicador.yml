# This is a basic workflow to help you get started with Actions

name: Comunicador de la Legión

on:
   workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Brainiac
          - Joker
          - Darkseid
      mensaje:
        description: "Mensaje a transmitir"
        required: true
        default: "La misión fue un éxito"
        type: string
      
      prioridad:
        description: "nivel de prioridad"
        required: true
        type: choice
        options:
          - Alta
          - Media
          - Critica

      cow_character:
        description: "Personaje de la granja para mostrar el mensaje"
        required: true
        type: choice
        options:
          - ghostbusters
          - eyes
          - hellokitty
          - dragon
          - ren
          - king

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la Legión
        run: sudo apt-get install -y cowsay
        
      - name:  Imprimir inputs
        run: |
          echo "=============================="
          echo "   Transmisiín interceptada   "
          echo "=============================="
          echo ""
          echo "De: ${{ inputs.villano}}"
          echo ""
          echo "Fechas ${date -u +%d/%m/%Y - %H:%M:%S UTC}"
          echo "-------- Mensaje --------"
          cowsay -f ${{ inputs.cow_character}} "${{ inputs.mensaje}}"
          echo ""
          echo "-- ${{ inputs.villano}}"
          echo " ... "
