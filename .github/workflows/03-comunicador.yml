# This is a basic workflow to help you get started with Actions

name: Comunicador de la Legión

on:
   workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano envia el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Brainiac
          - Joker
          - Darkseid
      mensaje:
        description: "Mensaje a transmitir"
        required: true
        default: "La misión fue un éxito"
        type: string
      
      prioridad:
        description: "nivel de prioridad"
        required: true
        type: choice
        options:
          - Alta
          - Media
          - Critica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
