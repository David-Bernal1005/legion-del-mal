name: 🙈 Acceso a la Fortaleza Prohibida

on: push

jobs:
    reporte-de-reclutamiento:
        runs-on: ubuntu-latest

        steps:
            - name: El agente llega a la Fortaleza
              run: |
                echo "Agente ${{ github.actor }} llega a la Fortaleza"
                echo ""
                echo "Buscar los archivos de la Legión"
                ls -la
                echo ""
                echo "✖️ pero qué pasó? No hay nada"
            
            - name: 'Brainiac desbloquea la bóveda'
              uses: actions/checkout@v4
            
            - name: 'Ahora si, vamor a ver los plane'
              run: |
                echo "Buscar los archivos de la Legión"
                ls -la
                echo ""
                echo "✅ Encontramos los archivos!"
                echo ""
                echo "Planes"
                ls planes/
                echo "Vilanos"
                ls miembros/
                echo "Inteligencia: "
                ls inteligencia/

